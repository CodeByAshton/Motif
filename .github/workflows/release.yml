# Push a version tag that matches manifest.json (e.g. `git tag 0.1.0 && git push origin 0.1.0`, or
# `npm version patch && git push --follow-tags`) to build, test and publish a GitHub release with
# main.js, manifest.json and styles.css attached.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          npm ci
          npm test
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Motif $GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
